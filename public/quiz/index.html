<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <meta>
</head>
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #container {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
    }

    .square {
        position: relative;
        background-color: white;
        margin: 10px;
    }

    .outlined {
        border: lightgray 1px solid;
        display: flex;
        justify-content: center; /* horizontally centers the text */
        align-items: center;     /* vertically centers the text */
        text-align: center;      /* optional, aligns text within the box */
        font-family: Helvetica, Arial, sans-serif;
        font-size: 5vh;
        width: 100%;
        height: 100%;
    }

    .big {
        font-size: 20vh;
    }

    .gridbox {
        display: grid;
        place-items: center;
        /*grid-template-rows: repeat(3, 1fr); */ /* Adjust 5 to the number of boxes */
        gap: 20px;                             /* Space between the boxes */
    }

    /* for wider layouts, squares side by side */
    @media (min-aspect-ratio: 1/1) {
        .square {
            width: calc((100vw - 40px) * 0.5);
            height: calc((100vw - 40px) * 0.5);
        }
    }

    /* for taller layouts, squares stacked vertically */
    @media (max-aspect-ratio: 1/1) {
        .square {
            width: calc((100vh - 40px) * 0.5);
            height: calc((100vh - 40px) * 0.5);
        }
        #container {
            flex-direction: column;
        }
    }

    .correct {
        position: absolute; /* absolute relative to .word */
        top: 10px;
        left: 10px;
        width: 100px;
        height: 36px;
        background-color: rgba(240, 190, 128, 0.33);
        font-size: 28px;
    }

    .level {
        position: absolute; /* absolute relative to .word */
        top: 10px;
        right: 10px;
        width: 36px;
        height: 36px;
        background-color: rgba(173, 216, 230, 0.33);
        font-size: 28px;
    }

    #word-content {
        width: 100%;
        height: 100%;
    }
    </style>
<body><div id="container"><div id="word" class="square"><div id="correct" class="outlined correct">0</div><div id="level" class="outlined level">0</div><div id="word-content" class="outlined big"></div></div><div id="buttons" class="square gridbox"></div></div></body>
<audio id="correctSound" src="sounds/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="sounds/wrong.mp3" preload="auto"></audio>
<script type="module" src="modules/index.mjs"></script>
</html>
